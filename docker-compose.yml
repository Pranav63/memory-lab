name: research-memory-lab
services:
  graph:
    image: falkordb/falkordb:v4.22.0
    ports:
      - "127.0.0.1:6390:6379"
    environment:
      BROWSER: "0"
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes:
      - memory_graph_v4:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
    mem_limit: 768m
volumes:
  memory_graph_v4:
